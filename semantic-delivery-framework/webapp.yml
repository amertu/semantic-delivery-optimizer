name: semantic-delivery-framework
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip>=24.0
  - flask=2.3.3
  - jinja2>=3.1.4
  - markupsafe>=2.1.3
  - click=8.1.7
  - itsdangerous=2.1.2
  - werkzeug=2.3.8
  - certifi>=2024.2.2
  - ca-certificates>=2024.2.2
  - openssl>=3.0.13
  - setuptools
  - wheel
  - sqlite>=3.44.2
  - vc  # Windows only
  - vs2015_runtime  # Windows only
  - wincertstore  # Windows only
  - pip:
    - dnspython==2.6.1
    - eventlet==0.35.1
    - greenlet>=3.0.3
    - monotonic>=1.6
    - six>=1.16.0
    - sparql-client==3.4
    - requests>=2.31.0
